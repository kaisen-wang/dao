; 更夫 Nightwatch — supervisor 进程守护配置（与 ../systemd/更夫.service 等价）
; 本文件是配置样例，未做真实云主机部署验证；详细说明见 ../README.md。
; 安装：sudo cp 更夫.conf /etc/supervisor/conf.d/ 后执行
;       supervisorctl reread && supervisorctl update && supervisorctl start 更夫

[program:更夫]
; command：绝对 Python 解释器 + 绝对解释器 main.py + 绝对入口脚本.道。
; 道语言脚本不能由 python 直接执行（会触发 SyntaxError），必须由 main.py 载入。
; 生产环境请把三项路径替换为真实安装路径，或将入口换成实际长驻服务脚本。
command=/home/carson/code/test/道/源码/.venv/bin/python /home/carson/code/test/道/源码/main.py /home/carson/code/test/道/示例/更夫/接入层/入口.道

; 道语言模块搜索基于 os.getcwd()，必须切到 示例/更夫 根目录。
directory=/home/carson/code/test/道/示例/更夫

; 运行账号：当前为开发机账号；生产环境请改为专用系统账号，不要用 root。
user=carson

; 随 supervisord 自启动；进程意外退出后自动重启。
autostart=true
autorestart=true

; 持续运行 5 秒才视为启动成功，配合 autorestart 防止反复抖动重启。
startsecs=5
startretries=3

; 日志位置：生产环境请确认 /var/log/supervisor 存在且运行账号可写。
stdout_logfile=/var/log/supervisor/更夫.stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/更夫.stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

; 环境变量：supervisor 把字典直接交给子进程，中文变量名可生效（与 systemd 不同）。
; GENGFU_NO_LLM=1 关闭本地 ollama，走关键词规则 + 模板报告降级路径。
; 更夫演示模式=0 启用生产白名单（初始仅 AI 本人）。
environment=GENGFU_NO_LLM=1,更夫端口=8765,更夫数据库=/var/lib/gengfu/gengfu.db,更夫Webhook端口=8766,更夫演示模式=0

; 停止方式：先发 INT 让解释器收尾，最多等 10 秒再强制终止。
stopsignal=INT
stopwaitsecs=10
