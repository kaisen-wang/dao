; 更夫 Nightwatch - supervisor 生产配置（第九轮，ASCII program 名 gengfu）
; 中文名 更夫.conf 仅作历史样例保留；生产请用本文件。
; 本文件为配置模板，未做真实云主机部署验证；详细说明见 ../README.md。
; 安装：sudo cp gengfu.conf /etc/supervisor/conf.d/ 后执行
;       supervisorctl reread && supervisorctl update && supervisorctl start gengfu
;
; 【现场替换】所有 /opt/gengfu 为部署根目录占位，请按实际安装路径修改。

[program:gengfu]
; command 指向与 systemd 相同的启动包装脚本（脚本内部再 export 中文变量并 exec 长驻入口）。
; 包装脚本须先 chmod +x；长驻入口为 接入层/常驻入口.道，替代跑完即退的演示入口.道。
command=/opt/gengfu/示例/更夫/部署/systemd/启动包装.sh

; 道语言模块搜索基于 os.getcwd()，必须切到 示例/更夫 根目录（按现场替换）。
directory=/opt/gengfu/示例/更夫

; 运行账号：生产专用系统账号 gengfu（不要用 root）。
user=gengfu

; 随 supervisord 自启动；进程意外退出后自动重启。
autostart=true
autorestart=true

; 持续运行 5 秒才视为启动成功，配合 autorestart 防止反复抖动重启。
startsecs=5
startretries=3

; 停止：先发 INT 给解释器收尾，同时业务侧 touch 更夫停机标记 走优雅停机。
; stopwaitsecs=15 覆盖 5 秒心跳周期（留 3 倍余量），确保心跳能检测到停机标记并退出；超时再强杀。
stopsignal=INT
stopwaitsecs=15

; 日志位置：按 50MB 轮转、保留 5 份；目录需现场创建并确保运行账号可写。
stdout_logfile=/var/log/supervisor/gengfu.stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/gengfu.stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

; 环境变量：supervisor 直接把字典交给子进程，中文变量名可生效（不受 systemd 限制）。
; 口径与 启动包装.sh 完全一致；其中停机标记须与 systemd ExecStop 指向同一文件。
; 更夫演示模式=0 启用生产白名单；GENGFU_NO_LLM=1 关闭本地 ollama 走降级路径。
environment=GENGFU_NO_LLM=1,更夫端口=8765,更夫数据库=/var/lib/gengfu/gengfu.db,更夫Webhook端口=8766,更夫演示模式=0,更夫停机标记=/opt/gengfu/run/gengfu.stop
