name: 构建全平台安装包

# 触发方式：
#   - 推送 v* 标签：构建三平台安装包并创建/更新 Release
#   - 手动触发：仅构建并上传 artifact，不发布 Release
#   - 推送 main / PR：仅跑测试，不打包（省 CI 时长）
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # Release 步骤需要写权限

# 中文源码路径与中文输出需要 UTF-8；显式声明避免 runner 默认 locale 差异。
env:
  PYTHONUTF8: '1'
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  # ---------- 快速测试（所有触发都跑） ----------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 环境诊断
        shell: bash
        run: |
          python -V
          python -c "import sys; print('filesystem encoding:', sys.getfilesystemencoding())"
          pwd
          ls -la
          echo "--- 源码目录 ---"
          ls -la 源码 | head -20

      - name: 安装测试依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 源码/requirements.txt
          python -m pip list | grep -Ei 'pytest|prompt|ruff|coverage'

      - name: 运行全量测试
        shell: bash
        working-directory: 源码
        run: python -m pytest tests/ -q

  # ---------- 构建矩阵（仅 tag 或手动触发） ----------
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch_label: x86_64
          - os: macos-13        # Intel
            arch_label: x86_64
          - os: macos-14        # Apple Silicon
            arch_label: arm64
          - os: windows-latest
            arch_label: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 安装构建依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.5" prompt-toolkit

      - name: 安装构建依赖（macOS）
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.5" prompt-toolkit

      - name: 安装构建依赖（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.5" prompt-toolkit
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, '源码'); from dao.version import __version__; print(__version__)")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION"

      - name: 构建原生安装包
        shell: bash
        env:
          ARCH_LABEL: ${{ matrix.arch_label }}
        run: |
          python 源码/构建安装包.py --arch-label "$ARCH_LABEL"

      - name: 冒烟测试（原生可执行文件）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/nuitka/dao.exe"
          else
            EXE="dist/nuitka/dao"
          fi
          "$EXE" --version
          "$EXE" --help | head -3

      - name: 上传安装包 artifact
        uses: actions/upload-artifact@v7
        with:
          name: dao-installer-${{ runner.os }}-${{ matrix.arch_label }}
          path: dist/installers/*
          if-no-files-found: error

  # ---------- 发布 Release（仅 tag 触发） ----------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 列出待发布产物
        run: ls -lh artifacts/
      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
