# Gitee Go 流水线 —— 道语言 Linux .deb 安装包构建
# ------------------------------------------------------------------
# 说明：
#   Gitee Go 使用自己的流水线格式（stages/steps），与 GitHub Actions 不兼容，
#   两者并行维护、互不干扰。
#   Gitee 托管构建机默认只有 Linux，因此本流水线产出 Linux .deb；
#   macOS .pkg 与 Windows setup.exe 由 .github/workflows/build-installers.yml
#   的四平台矩阵负责。若要在 Gitee 上产出全平台包，需在「Gitee Go → 自有主机」
#   注册 macOS / Windows Runner，并把本文件中的 executor 指向对应主机组。
#
# 触发：推送 v* 标签（在 Gitee Go 网页端把该流水线的触发事件设为 Push + 标签 v*）
version: '1.0'
name: dao-build-deb
displayName: 道语言-Linux安装包构建
triggers:
  push:
    branches:
      include:
        - main
    tags:
      include:
        - 'v.*'
        - 'v*'

stages:
  - name: build-deb
    displayName: 构建 Debian 安装包
    strategy: naturally
    trigger: auto
    executor: []          # 使用 Gitee 托管 Linux 构建机
    steps:
      - step: build@python
        name: build_deb
        displayName: 编译并打包 .deb
        pythonVersion: '3.13'
        commands:
          - python -m pip install --upgrade pip
          - python -m pip install "nuitka>=2.5" prompt-toolkit
          - python -m pytest 源码/tests/ -q
          - python 源码/构建安装包.py
          - ls -lh dist/installers/
        artifacts:
          - name: DAO_DEB
            path:
              - dist/installers/
        caches:
          - /root/.cache/pip
        notify: []
        strategy:
          retry: '0'

  - name: release
    displayName: 发布到 Gitee Release
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: 道语言 v${GITEE_PIPELINE_BUILD_NUMBER}
        description: CHANGELOG.md
        tagName: v${GITEE_PIPELINE_BUILD_NUMBER}
        upstreamArtifact:
          - DAO_DEB
        # 用通配符避免硬编码版本号（版本号单一来源是 dao/version.py）
        assertFiles:
          - dist/installers/*.deb
        prerelease: false
        allowUpdate: true
        notify: []
        strategy:
          retry: '0'
